<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholar Space</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav>

      <div class="logo">
        <div class="logo-icon">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYq9RK3qr0N_NuPKlcNky1Tl0n-dSnl4nVqjMB_GrhLhhaQv-hG64HUwCG&s=10"
            alt="logo not found">
        </div>
        <h1>Scholar Space</h1>
      </div>

      <ul class="nav-links">
        <li><a href="#">Courses</a></li>
        <li><a href="#">Learning paths</a></li>
        <li><a href="#">Instructors</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Pricing</a></li>
      </ul>

      <div class="nav-right">
        <a href="#" class="sign-in">Sign in</a>

        <a href="#" class="explore-btn">
          Explore courses
          <span class="arrow">↗</span>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <div class="info">
      <span>ONLINE ACADEMY / EST. 2026</span>
    </div>

    <section class="hero">
      <div class="big-text">
        <span>Learn.</span>
        <span>Practice.</span>
        <span class="evolve">Evolve
          <div class="dot"></div>
        </span>
      </div>
      
      <figure class="video-player">
        <video controls preload="metadata">
          <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
          Your browser does not support the video element.
        </video>
        <figcaption>Video lesson: a short sample clip. Replace this with your own recorded lesson, such as "How a webpage is structured".</figcaption>
      </figure>
    </section>

    <section class="below-text">
      <p>Real skills from real experts, so every lesson brings you one step closer to your goals.</p>
    </section>


  </main>
</body>

</html>
